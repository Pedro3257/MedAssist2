services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: medassist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medassist}
      POSTGRES_USER: ${POSTGRES_USER:-medassist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - medassist_postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-medassist} -d ${POSTGRES_DB:-medassist}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  medassist_postgres_data:

